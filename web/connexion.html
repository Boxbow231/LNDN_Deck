<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Nominés du Néombre - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
    <div class="logo-container">
        <a href="https://lesnominesduneombre.fr" target="_blank" rel="noopener noreferrer">
            <img src="image/logo_nomines.jpg" alt="Les Nominés du Néombre" class="game-logo">
        </a>
    </div>
        
        <section id="login-section">
            <h2>Connexion</h2>
            <form id="login-form" action="accueil.html">
                <div class="form-group">
                    <label for="login-email">Adresse Email</label>
                    <input type="email" id="login-email" required>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" required>
                </div>
                
                <button type="submit">Se connecter</button>
            </form>
            <p>Pas encore de compte ? <a href="inscription.html">Créer une aventure</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.22.0/dist/pocketbase.umd.js"></script>
    <script src="auth.js"></script>
</body>
</html>
