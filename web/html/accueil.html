<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Nominés du Néombre - Accueil</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="auth-container" style="max-width: 800px;">
        <div class="logo-container">
            <a href="https://lesnominesduneombre.fr" target="_blank" rel="noopener noreferrer">
                <img src="../image/logo_nomines.jpg" alt="Les Nominés du Néombre" class="game-logo">
            </a>
        </div>

        <section id="dashboard-section" style="text-align: center;">
            <h2>Bienvenue dans l'aventure</h2>
            
            <p style="margin-bottom: 2rem;">Voici votre tableau de bord. C'est ici que vos decks et aventures apparaîtront.</p>

            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button type="button" style="width: auto; padding: 0.8rem 2rem;">Nouvelle aventure</button>
                <a href="#" id="logout-btn"><button type="button" style="width: auto; padding: 0.8rem 2rem; background-color: transparent;">Se déconnecter</button></a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.22.0/dist/pocketbase.umd.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
