<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Nominés du Néombre - Mes Aventures</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="auth-container" style="max-width: 600px;">
        <div class="logo-container">
            <a href="https://lesnominesduneombre.fr" target="_blank" rel="noopener noreferrer">
                <img src="../image/logo_nomines.jpg" alt="Les Nominés du Néombre" class="game-logo" style="max-width: 250px;">
            </a>
        </div>
        
        <div id="user-greeting" style="position: absolute; top: 1.2rem; left: 1.2rem; font-family: 'Cinzel', serif; font-weight: bold; font-size: 1.1rem; color: var(--encre-noire);">
            <!-- Le nom sera injecté ici par JavaScript -->
        </div>
        <a href="amis.html" style="position: absolute; top: 1rem; right: 1rem; text-decoration: none; color: var(--encre-noire); font-family: 'Cinzel', serif; font-weight: bold; font-size: 1.1rem; border: 1px solid var(--encre-noire); padding: 0.3rem 0.8rem; border-radius: 4px; transition: all 0.3s;" onmouseover="this.style.backgroundColor='var(--encre-noire)'; this.style.color='#f4ecd8';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='var(--encre-noire)';">
            👥 Amis
        </a>

        <section id="dashboard-section">
            <h2>Mes Aventures</h2>

            <!-- Formulaire pour lancer une aventure -->
            <form id="create-aventure-form" style="margin-bottom: 2rem;">
                <div class="form-group">
                    <label for="aventure-nom">Nouvelle aventure</label>
                    <input type="text" id="aventure-nom" placeholder="Ex : La Croisade de l'Ombre" required>
                </div>
                <button type="submit" class="btn-icon">
                    <img src="../image/dos_butins.png" alt="Butins">
                    <span>Commencer une aventure</span>
                </button>
            </form>

            <!-- Liste des aventures existantes -->
            <div id="aventures-liste" style="display: flex; flex-direction: column; gap: 1rem;">
                <p style="text-align: center; color: var(--gris-dessin);">Chargement de vos chroniques…</p>
            </div>
            

            <!-- Déconnexion -->
            <div style="margin-top: 2rem; text-align: center;">
                <a href="#" id="logout-btn" style="font-family: 'Cinzel', serif; text-transform: uppercase; font-size: 0.9rem;">Quitter le Néombre (Déconnexion)</a>
            </div>
        </section>
    </main>

    <!-- SDK PocketBase -->
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.22.0/dist/pocketbase.umd.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/accueil.js"></script>
</body>
</html>
